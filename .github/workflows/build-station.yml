name: Build Station

on:
  workflow_dispatch:

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Create venv
        run: uv venv --python 3.13
      - name: Install system deps
        run: sudo apt update && sudo apt install libjpeg-dev zlib1g-dev
      - name: Install python deps
        run: uv pip install -r requirements.txt
      - name: Generate station
        run: uv run make station; mkdir release; mv ens.grf release/
      - name: Pack documentation
        run: cp docs/changelog.md release/changelog.txt 2>/dev/null || true; cp docs/readme.md release/readme.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emperors-new-station
          path: release
          retention-days: 7
